<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Танки 2D</title>
<style>
:root{--bg:#1d2418;--fg:#e8ecd8;--ac:#c9a227}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2418;--fg:#e8ecd8}}
html,body{height:100%;margin:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
#gc{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}body:not(.play) #c{display:none}body.play{background:#2b3022;touch-action:none;overscroll-behavior:none}
canvas#c{width:min(100vw,calc(100vh*1.5625));height:min(100vh,calc(100vw*.64));background:#2b3022;touch-action:none;cursor:crosshair}
.o{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;gap:12px;background:#000a;z-index:20;padding:16px 0;box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}.o>:first-child{margin-top:auto}.o>:last-child{margin-bottom:auto}#menu{align-items:flex-start;background:none;padding-left:max(4vw,env(safe-area-inset-left,0px));touch-action:pan-y}#menu h1{font-size:min(7vw,44px);margin:0 0 6px}
.o.show{display:flex}
h1{margin:0 0 10px;font-size:min(9vw,64px);letter-spacing:3px;color:var(--ac);text-shadow:0 3px 0 #000a}
.btn{min-width:240px;box-sizing:border-box;padding:12px 20px;font:bold 18px system-ui;color:#fff;text-shadow:0 2px 0 #0007;background:linear-gradient(#5a95d8,#2f5f9f);border:2px solid #17335c;border-radius:8px;box-shadow:inset 0 2px 0 #fff5,0 3px 0 #0a1a33;text-align:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn.g{background:linear-gradient(#7fe05a,#2f9a1e);border-color:#175c0e;box-shadow:inset 0 2px 0 #fff6,0 3px 0 #0d3a07}.btn:active{filter:brightness(.8);transform:translateY(2px)}.btn.sel{background:linear-gradient(#f3d35a,#c9a227);color:#1d2418;text-shadow:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}.row b{min-width:130px;text-align:right;font-size:15px}
.row .btn{min-width:0;padding:8px 14px;font-size:15px}
.sw{width:40px;height:40px;padding:0;border-radius:50%}
.hud{position:fixed;display:none;z-index:10;width:44px;height:44px;min-width:0;padding:0;font-size:22px;line-height:40px}
body.play .hud{display:block}#mb{left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px))}#fs{right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:block;z-index:30}
#coin{position:fixed;z-index:30;right:calc(64px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));min-width:0;padding:9px 14px;font-size:16px;cursor:default}body.play #coin{display:none}
#toast{position:fixed;z-index:60;left:10%;right:10%;bottom:20px;background:#000d;color:#fff;padding:12px;border-radius:10px;text-align:center;font-size:14px;display:none}
.tc{display:none;position:fixed;z-index:8;touch-action:none}
body.touch.play .tc{display:block}
#zl{left:0;top:15%;bottom:0;width:50%}
#jb,#jb2{width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff66;position:absolute;left:70px;bottom:50px;pointer-events:none}
#jk,#jk2{width:54px;height:54px;border-radius:50%;background:#ffffffaa;position:absolute;left:33px;top:33px}
#zr{right:0;top:15%;bottom:0;width:50%}#jb2{left:auto;right:70px}body.touch.play #zr{display:none}body.touch.play.stick2 #zr{display:block}body.touch.play.stick2 #fire{display:none}
#fire{right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;background:#e4443aaa;border:2px solid #fff9;color:#fff;font:bold 18px system-ui;line-height:110px;text-align:center}
#fire.on{background:#ff7a70}
#rot{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);align-items:center;justify-content:center;text-align:center;font-size:20px;padding:20px}
@media (orientation:portrait){body.touch #rot{display:flex}}
#hint{position:fixed;bottom:3px;left:0;right:0;text-align:center;font-size:12px;opacity:.6;pointer-events:none}body.touch #hint{display:none}
.cn{display:inline-block;width:14px;height:14px;box-sizing:border-box;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d6c374,#8a7326);border:2px solid #5a4a14;vertical-align:-2px}
#coin{background:#1c2018;color:#d9dcc8;border-color:#0c0e08;box-shadow:none}
#shop{background:#12150fee;justify-content:flex-start;gap:6px;padding-top:max(10px,env(safe-area-inset-top,0px))}
#shop>:first-child,#shop>:last-child{margin:0}
#shop .btn{min-width:0;padding:8px 14px;font-size:13px;letter-spacing:1px;color:#d9dcc8;text-shadow:none;background:linear-gradient(#4a5240,#2f3628);border-color:#1a1f15;box-shadow:inset 0 1px 0 #fff2,0 2px 0 #0a0d07}
#shop .btn.sel{background:linear-gradient(#b39b45,#8a7628);color:#14170f}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box;padding:0 4vw;flex-wrap:wrap}
.sh h1{font-size:20px;margin:0;letter-spacing:5px;color:#c3ad5a;text-shadow:none}
.bal{padding:7px 12px;background:#1c2018;border:1px solid #4d5740;border-radius:4px;font:bold 14px system-ui;color:#e1e3d0}
.gr{display:flex;gap:10px;overflow-x:auto;width:100%;box-sizing:border-box;padding:6px 4vw 12px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.cd{flex:0 0 158px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding-bottom:8px;overflow:hidden;text-align:center;cursor:pointer;background:linear-gradient(#313929,#1f2418);border:1px solid #4d5740;border-top:3px solid #6c6a3c;border-radius:4px;-webkit-tap-highlight-color:transparent}
.cd.sel{border-color:#a08f43}.cd:active{filter:brightness(.85)}
.rb{display:flex;justify-content:space-between;padding:4px 8px;background:#12150f;color:#8e957c;font:bold 10px system-ui;letter-spacing:1px}.rb b{color:#c3ad5a}.cd.own .rb b{color:#8fa27a}
.cd h3{margin:2px 0 0;font-size:15px;letter-spacing:2px;color:#e1e3d0}.cd small{color:#8e957c;font-size:11px;letter-spacing:1px}
.cd canvas{width:100%;aspect-ratio:300/220;display:block}
.sr{display:flex;align-items:center;gap:6px;padding:0 10px;font-size:10px;color:#9aa088}.sr span{width:54px;text-align:left}.sr u{flex:1;height:5px;background:#12150f;border-radius:2px;overflow:hidden;text-decoration:none}.sr i{display:block;height:100%;background:#a08f43}
.cd p{margin:2px 10px;font-size:11px;line-height:1.3;color:#b3b8a0;min-height:30px}
.pb{margin:0 10px;padding:7px;background:#12150f;border:1px solid #4d5740;border-radius:3px;font:bold 13px system-ui;color:#d9dcc8}.cd.own .pb{color:#9fb08a}.cd.no .pb{color:#b0675a}
body:has(#shop.show) #coin{display:none}
.sh{padding-right:calc(64px + 2vw)}
/* единый стиль */
h1{color:#c3ad5a;text-shadow:none;letter-spacing:6px}
.btn{background:linear-gradient(#3a4230,#262c1f);border:1px solid #4d5740;border-left:4px solid #8a7a3a;border-radius:3px;box-shadow:0 2px 0 #0a0d07;color:#d9dcc8;text-shadow:none;font:600 15px system-ui;letter-spacing:2px}
.btn:active{filter:brightness(.8);transform:translateY(1px)}
.btn.g{background:linear-gradient(#b39b45,#86722a);border-color:#d0bb68;border-left-color:#e6d58a;color:#14170f;font-weight:800}
.btn.sel{background:linear-gradient(#b39b45,#86722a);color:#14170f}
.hud,.sw{border-left-width:1px}.sw{border-radius:50%}
.hud{border-radius:4px}
#menu{background:linear-gradient(90deg,#0e110bf2 0%,#0e110bcc 36%,#0e110b00 62%)}
#menu h1{border-bottom:2px solid #6c6a3c;padding-bottom:10px;margin-bottom:14px}
#menu .btn{width:min(300px,44vw);text-align:left;padding-left:20px}
#set,#go,#mp{background:#10130dee}
#go h1{font-size:min(8vw,34px);margin:0;text-align:center}
#gi{display:flex;gap:10px}
#gi div{min-width:96px;padding:10px 14px;background:#1c2018;border:1px solid #4d5740;border-top:3px solid #6c6a3c;border-radius:3px;text-align:center}
#gi b{display:block;font-size:24px;color:#e1e3d0}#gi span{font-size:10px;letter-spacing:2px;color:#8e957c}
#go .btn{width:260px}
.hud{font-size:22px;letter-spacing:0;padding:0;line-height:40px}#coin{letter-spacing:1px;font-size:14px;padding:9px 14px}

canvas#c{background:transparent!important;position:relative;z-index:1}
#vg{position:fixed;inset:0;z-index:2;pointer-events:none;display:none;background:radial-gradient(ellipse at center,#0000 50%,#06080470 100%)}body.play #vg{display:block}
#perk{background:#10130dd8}#perk h1{font-size:min(6vw,24px);margin:0;text-align:center;letter-spacing:3px}#perk .gr{justify-content:center;overflow:visible}.pv{font-size:34px;font-weight:800;color:#c3ad5a;padding:14px 0}
.cd .pb{margin-top:auto}.cd p{margin-bottom:6px}

.ic canvas{width:100%;height:auto;display:block}
.df{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:#8e957c;padding:0 6px;flex-wrap:wrap}.df i{font-style:normal;font-size:10px;letter-spacing:1px;flex-basis:100%}.df span{color:#b3b8a0}.df b{color:#c3ad5a;font-size:15px}
#lg{display:flex;gap:16px;align-items:center;color:#b3b8a0;font-size:12px;flex-wrap:wrap;justify-content:center}#lg i{font-style:normal;letter-spacing:2px;color:#8e957c;font-size:10px}#lg span{display:flex;align-items:center;gap:6px}
#perk .cd{flex-basis:170px}
</style></head><body>

<div class="btn hud" id="mb">☰</div><div class="btn hud" id="fs">⛶</div>
<div class="tc" id="zl"><div id="jb"><div id="jk"></div></div></div><div class="tc" id="zr"><div id="jb2"><div id="jk2"></div></div></div><div class="tc" id="fire">ОГОНЬ</div>
<div id="hint"></div><div id="vg"></div>

function bar(o){if(o.remote){g.save();g.fillStyle='#e1e3d0';g.font='bold 12px system-ui';g.textAlign='center';g.fillText('Игрок '+o.rid,o.x,o.y-64);g.restore()}const r=o.hp/o.max;g.fillStyle='#0008';g.fillRect(o.x-30,o.y-58,60,6);g.fillStyle=o.pl?'#5cf':r>.5?'#6c4':r>.25?'#ec4':'#e44';g.fillRect(o.x-29,o.y-57,58*Math.max(0,r),4)}
function mkDark(){for(let k=0;k<3;k++){const s=S['sm'+k],c=document.createElement('canvas');c.width=s.width;c.height=s.height;const x=c.getContext('2d');x.drawImage(s,0,0);x.globalCompositeOperation='source-atop';x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,c.width,c.height);S['sd'+k]=c}}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(loaded<total){g.fillStyle='#2b3022';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.font='20px system-ui';g.fillText('Загрузка…',20,30);requestAnimationFrame(frame);return}
 if(!S.sd0){mkDark();mkSmall();mkBG()}upd(dt);engine();if(mode=='menu'){garage(now);requestAnimationFrame(frame);return}g.clearRect(0,0,W,H);
 g.drawImage(mk,0,0);drawPU();for(const o of T){drawTank(o);if(mode=='play')bar(o)}
 for(const b of B){const im=S[b.spr];g.save();g.translate(b.x,b.y);g.rotate(b.a+Math.PI/2);g.drawImage(im,-im.width/2,-im.height/2);g.restore()}
 for(const s of SM){const im=S[(s.dk?'sd':'sm')+s.k],k=s.sz*(.6+s.age/s.life*1.4);g.save();g.globalAlpha=s.a0*(1-s.age/s.life);g.translate(s.x,s.y);g.rotate(s.r+s.age);g.drawImage(im,-im.width*k/2,-im.height*k/2,im.width*k,im.height*k);g.restore()}
 for(const f of FX){if(f.t=='tx'){const p=f.age/f.life;g.save();g.globalAlpha=Math.min(1,(1-p)*2);g.fillStyle=f.c;g.font='bold '+f.z+'px system-ui';g.textAlign='center';g.fillText(f.s,f.x,f.y+f.vy*f.age);g.restore()}else if(f.t=='fl'){const im=S.fl;g.save();g.translate(f.x,f.y);g.rotate(f.a+Math.PI/2);g.drawImage(im,-im.width/2,-im.height/2);g.restore()}
  else{const im=S['ex'+Math.min(8,f.age/f.life*9|0)],k=f.s;g.drawImage(im,f.x-im.width*k/2,f.y-im.height*k/2,im.width*k,im.height*k)}}
 if(mode=='play'){drawBarrier();g.fillStyle='#10130dc0';g.fillRect(58,12,500,34);g.strokeStyle='#4d5740';g.strokeRect(58.5,12.5,499,33);g.fillStyle='#e1e3d0';g.font='bold 17px system-ui';g.textAlign='left';g.fillText((ONLINE?'Убийств: '+kills+'   Броня: '+Math.max(0,P.hp|0)+'   Онлайн: '+(Object.keys(RM).length+1)+'/25':'Счёт: '+score+'   Волна: '+wave+'   Броня: '+Math.max(0,P.hp|0)+'   Монеты: '+SV.coins),66,36);hudx()}
 requestAnimationFrame(frame)}

// ---- МУЛЬТИПЛЕЕР ----
const wsend=o=>{if(ws&&ws.readyState==1)ws.send(JSON.stringify(o))};
const rspawn=()=>[80+Math.random()*(W-160),80+Math.random()*(H-160)];
function startOnline(){run=0;PU=[];combo=0;comboT=0;mode='play';over=false;score=0;wave=1;kills=0;document.body.classList.add('play');T=[];B=[];FX=[];SM=[];WR=[];mc.clearRect(0,0,W,H);gtile();document.body.classList.toggle('stick2',TOUCH&&!CFG.auto);const p=rspawn();P=tank(p[0],p[1],0,0);P.h=P.a=-Math.PI/2;T.push(P);for(const k in RM)T.push(RM[k]);show(null)}
function onDeath(){over=true;wsend({t:'dead',by:lastBy});toast('Вас подбили! Возрождение через 3 с');const s=SID;setTimeout(()=>{if(!ONLINE||s!=SID)return;const p=rspawn();P=tank(p[0],p[1],0,0);P.h=P.a=-Math.PI/2;T.push(P);over=false;lastBy=0},3000)}
function mpStatus(){if(mode!='menu'||!$('mp').classList.contains('show'))return;
 fetch('/status').then(r=>r.json()).then(d=>{$('mps').textContent='Сервер 1 · '+d.online+'/'+d.max;$('mpi').textContent=d.online>=d.max?'Сервер полон':'Нажмите на сервер, чтобы войти'}).catch(()=>{$('mps').textContent='Сервер недоступен';$('mpi').textContent='Откройте игру по адресу вашего сервера (не файлом с телефона/компьютера)'})}
function mpJoin(){if(ws)return;try{ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host)}catch(e){ws=null;toast('Нет подключения к серверу');return}
 ws.onerror=()=>toast('Не удалось подключиться');
 ws.onclose=()=>{const was=ONLINE;ws=null;if(was){toast('Соединение потеряно');menu();show('mp')}};
 ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(x){return}
  if(d.t=='hello'){myId=d.id;ONLINE=true;RM={};startOnline()}
  else if(d.t=='full'){toast('Сервер полон (25/25)')}
  else if(!ONLINE)return;
  else if(d.t=='st'){let o=RM[d.id];if(!o){o=RM[d.id]={team:100+d.id,remote:1,rid:d.id,arm:1,x:d.x,y:d.y,h:d.h,a:d.a,hp:1,max:1,dist:0};T.push(o)}else if(o.out){o.out=0;o.x=d.x;o.y=d.y;T.push(o)}
   o.tx=d.x;o.ty=d.y;o.th=d.h;o.ta=d.a;o.hk=d.hk;o.gk=d.gk;o.tk=d.tk;o.dist=d.dist;o.hp=d.hp;o.max=d.max}
  else if(d.t=='sh'){const o=RM[d.id];if(!o||!d.b||!d.b.length)return;for(const b of d.b)B.push({x:b.x,y:b.y,a:b.a,team:o.team,pl:0,spr:b.spr,dmg:0,spl:0,pi:0,life:b.life,hit:[],vx:b.vx,vy:b.vy});sfxShot({pl:0,x:d.b[0].x,y:d.b[0].y})}
  else if(d.t=='hit'){if(P&&!over){lastBy=d.id;hurt(P,d.d,null)}}
  else if(d.t=='dead'){const o=RM[d.id];if(o&&!o.out){boom(o.x,o.y,1.4);sfxBoom(o.x,o.y);WR.push({x:o.x,y:o.y,t:5,e:0});o.out=1;T=T.filter(t=>t!==o)}if(d.by==myId&&P&&!over){kills++;pop(P.x,P.y-50,'+1 УБИЙСТВО','#e1e3d0',16)}}
  else if(d.t=='bye'){const o=RM[d.id];if(o)T=T.filter(t=>t!==o);delete RM[d.id]}}}
setInterval(()=>{if(ONLINE&&P&&!over)wsend({t:'st',x:+P.x.toFixed(1),y:+P.y.toFixed(1),h:+P.h.toFixed(2),a:+P.a.toFixed(2),hk:P.hk,gk:P.gk,tk:P.tk,dist:Math.round(P.dist),hp:Math.round(P.hp),max:P.max})},50);
setInterval(mpStatus,3000);
$('bmp').onclick=()=>{show('mp');mpStatus()};$('mpb').onclick=()=>show('menu');$('mps').onclick=mpJoin;
menu();requestAnimationFrame(frame);
</script></body></html>
